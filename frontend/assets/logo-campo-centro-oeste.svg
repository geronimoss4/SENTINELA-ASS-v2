<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Campo Centro Oeste — Sistema Hospitalar</title>
  <desc id="desc">Pirâmide egípcia dourada em camadas com cruz médica escura integrada, seguida do nome Campo Centro Oeste.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8df82"/>
      <stop offset="0.35" stop-color="#d4af37"/>
      <stop offset="0.68" stop-color="#b48620"/>
      <stop offset="1" stop-color="#f0cf68"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2bd4d"/>
      <stop offset="1" stop-color="#8e6717"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ornamento egípcio superior -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path stroke-width="4" d="M95 48H350 M650 48H905"/>
    <path stroke-width="4" d="M365 48l16-10 16 10 16-10 16 10 M635 48l-16-10-16 10-16-10-16 10"/>
    <circle cx="500" cy="48" r="6" fill="#d4af37" stroke="none"/>
  </g>

  <!-- PIRÂMIDE DOURADA — mesmo conceito do modelo: camadas largas e simétricas -->
  <g filter="url(#glow)" stroke="#e6c65b" stroke-width="3" stroke-linejoin="round">
    <!-- ponta -->
    <path d="M500 90 L552 170 L448 170 Z" fill="url(#gold)"/>
    <!-- primeiro degrau -->
    <path d="M448 170 L552 170 L592 232 L408 232 Z" fill="url(#goldDark)"/>
    <!-- segundo degrau -->
    <path d="M408 232 L592 232 L632 296 L368 296 Z" fill="url(#gold)"/>
    <!-- terceiro degrau -->
    <path d="M368 296 L632 296 L675 365 L325 365 Z" fill="url(#goldDark)"/>
    <!-- base -->
    <path d="M325 365 L675 365 L720 438 L280 438 Z" fill="url(#gold)"/>

    <!-- divisões horizontais da pirâmide -->
    <path d="M408 232H592 M368 296H632 M325 365H675" fill="none" opacity=".75"/>
    <!-- linhas centrais/facetas -->
    <path d="M500 90V170 M500 170V232 M500 232V296 M500 296V365 M500 365V438" fill="none" opacity=".34"/>
  </g>

  <!-- Cruz médica preta, grande e centralizada -->
  <path d="M458 238H542V274H578V358H542V394H458V358H422V274H458Z"
        fill="#090908" stroke="#e5c45b" stroke-width="5" stroke-linejoin="round"/>

  <!-- Linha divisória -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path stroke-width="4" d="M110 510H365 M635 510H890"/>
    <circle cx="500" cy="510" r="6" fill="#d4af37" stroke="none"/>
  </g>

  <!-- Nome -->
  <text x="500" y="575" text-anchor="middle" fill="url(#gold)"
        font-family="Cinzel, 'Times New Roman', serif" font-size="48" font-weight="600" letter-spacing="5">
    CAMPO CENTRO OESTE
  </text>

  <!-- Identidade egípcia / hieróglifos -->
  <text x="500" y="625" text-anchor="middle" fill="#ead8a6"
        font-family="serif" font-size="24" letter-spacing="9" opacity=".95">
    𓂀 𓋹 𓆣 𓅓 𓏏 𓂋 𓎡 𓊪 𓏏
  </text>

  <text x="500" y="665" text-anchor="middle" fill="#d4af37"
        font-family="Cinzel, 'Times New Roman', serif" font-size="16" letter-spacing="6" opacity=".9">
    SISTEMA HOSPITALAR
  </text>
</svg>
